; CerberusLeaderVoice.ini - goes next to CerberusLeaderVoice.asi in the game's scripts\ folder.
;
; The Cerberus leader's voice (Y1V1) was only recorded for three speech types. For every other
; type the game plays nothing. Each line below gives an empty type one of his recorded sets:
;
;   DS   = his DEFINITE_SIGHTING lines   (Y1V1DS1-6)
;   CFA  = his CALL_FOR_ASSISTANCE lines (Y1V1CFA1-6)
;   GIC  = his IDLE_MUMBLING lines       (Y1V1GIC1-10)
;   DS3  = only one line (here Y1V1DS3.WAV)
;   CFA4-6 = only those consecutive lines (Y1V1CFA4, 5 and 6)
;   OFF  = nothing (the vanilla state for every type not listed)
;   blank or missing = leave the type as vanilla has it
;
; Changes take effect on the next game start.

[Map]
; Same as every other Cerberus voice: joining an attack uses the sighting lines.
JOIN_ATTACK=DS
; Calling for help reuses calling for assistance.
SHOUT_FOR_HELP=CFA
; Combat barks. Turn any of these OFF if the sighting lines sound wrong there.
TAUNT_CHASE=DS
TAUNT_SHORT=DS
WAIT_ENEMY_ALONE=DS
; Several hunters closing in: "Let's finish this prick right here, boys!" etc.
WAIT_ENEMY_MULTIPLE=CFA
WAIT_IN_COVER=DS
TAUNT_COMBAT=DS
TAUNT_COMBAT_POSITIVE=DS
TAUNT_COMBAT_NEGATIVE=DS
SURPRISE=DS

; Searching and investigating (he hasn't seen you): his mumbling lines, since the
; sighting lines would give away that he's found you.
TAUNT_SEARCH=GIC
; To try: taunt you while searching with only "I'm a born hunter. You can't hide from
; me." (DS3). Comment out the line above and uncomment this one.
;TAUNT_SEARCH=DS3
NEGATIVE_SEARCH_RESULT=GIC
CURIOSITY_NO_RESULT=GIC
STOP_AND_LISTEN=GIC
RUN_TO_INVESTIGATE=GIC
WALK_TO_INVESTIGATE=GIC
SNEAK_INVESTIGATE=GIC

; Talking with the bodyguards.
CHATTING=GIC
SEARCH_CHAT=GIC
INVESTIGATE_CHAT=GIC
GREETINGS=GIC

; Still empty for him (off):
; TAUNT_PLAYER_DEAD=
; TAUNT_SAFEZONE=
; TAUNT_BOUNDARY=
; PROBABLE_SIGHTING=
; PROBABLE_HEARING=
; SEEN_RUNNING_INTO_SAFEZONE=
; CLAIM_TERRITORY=
; WHISTLING=

; His three recorded types can also be changed or turned OFF here:
; DEFINITE_SIGHTING=
; IDLE_MUMBLING=
; SHOUT_FOR_ASSISTANCE=

[General]
; 0 = only write cerberusleadervoice_asi.log if something goes wrong.
; 1 = log every start, with one line per type changed.
Log=0
